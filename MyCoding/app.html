<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2d3748;
        }
        .balance-box {
            background: #2b6cb0;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-box h3 {
            font-size: 28px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-top: 5px;
        }
        input:focus {
            border-color: #2b6cb0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2c5282;
        }
        .transactions {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 5px solid #cbd5e0;
        }
        .transaction-item.income {
            border-left-color: #48bb78;
        }
        .transaction-item.expense {
            border-left-color: #f56565;
        }
        .delete-btn {
            background: #fed7d7;
            color: #c53030;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 Expense Tracker</h2>
        
        <div class="balance-box">
            <span>Total Balance</span>
            <h3 id="balance">₹0</h3>
        </div>

        <div class="form-group">
            <input type="text" id="desc" placeholder="Kiska kharcha ya income hai? (Jaise: Salary, Chai)">
        </div>
        <div class="form-group">
            <input type="number" id="amount" placeholder="Amount daalein (₹)">
        </div>
        <div class="form-group">
            <select id="type">
                <option value="income">Income (Paisa Aaya)</option>
                <option value="expense">Expense (Paisa Gaya)</option>
            </select>
        </div>
        <button id="addBtn">Transaction Jodein</button>

        <div class="transactions" id="transactionList"></div>
    </div>

    <script>
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const addBtn = document.getElementById('addBtn');
        const transactionList = document.getElementById('transactionList');
        const balanceDisplay = document.getElementById('balance');

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function updateApp() {
            transactionList.innerHTML = '';
            let totalBalance = 0;

            transactions.forEach((item, index) => {
                const amountVal = Number(item.amount);
                if (item.type === 'income') {
                    totalBalance += amountVal;
                } else {
                    totalBalance -= amountVal;
                }

                const div = document.createElement('div');
                div.classList.add('transaction-item', item.type);
                div.innerHTML = `
                    <span>${item.desc} - <strong>₹${item.amount}</strong></span>
                    <button class="delete-btn" onclick="deleteTransaction(${index})">Delete</button>
                `;
                transactionList.appendChild(div);
            });

            balanceDisplay.innerText = `₹${totalBalance}`;
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        addBtn.addEventListener('click', () => {
            const desc = descInput.value.trim();
            const amount = amountInput.value.trim();
            const type = typeInput.value;

            if (desc === '' || amount === '') {
                alert('Kripya sabhi details bharein!');
                return;
            }

            const newTransaction = { desc, amount, type };
            transactions.push(newTransaction);

            descInput.value = '';
            amountInput.value = '';
            updateApp();
        });

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateApp();
        }

        updateApp();
    </script>
</body>
</html>
