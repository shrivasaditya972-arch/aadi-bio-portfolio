<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalFlow Pro - Ultimate Play Store Icon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Ultimate Play Store App Icon Container */
        .playstore-icon {
            width: 340px;
            height: 340px;
            background: linear-gradient(135deg, #1e1b4b 0%, #090d16 100%);
            border-radius: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 30px 70px rgba(99, 102, 241, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(129, 140, 248, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        /* Vibrant background glow */
        .playstore-icon::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, transparent 70%);
            top: 20px;
        }

        .icon-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Large, prominent, stunning center box with Dart/Target Icon */
        .icon-symbol {
            width: 115px;
            height: 115px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 58px;
            color: #ffffff;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.7), inset 0 3px 8px rgba(255, 255, 255, 0.6);
            border: 2.5px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
        }

        .app-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 27px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.6px;
            margin-bottom: 3px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .app-tagline {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11.5px;
            font-weight: 800;
            color: #a5b4fc;
            letter-spacing: 4px;
            text-transform: uppercase;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <div class="playstore-icon">
        <div class="icon-content">
            <div class="icon-symbol">
                <!-- Bullseye with Dart Hit Icon -->
                <i class="fa-solid fa-bullseye"></i>
            </div>
            <div class="app-title">GoalFlow</div>
            <div class="app-tagline">Goal Tracker</div>
        </div>
    </div>

</body>
</html>
